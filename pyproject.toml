[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asip"
version = "0.0.0"
description = "AI Social Intelligence Platform — coordination detection with forensic-grade evidence"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "TBD" }

# Dependencies land with the code that needs them, not ahead of it (CLAUDE.md
# §3). These four arrive with the evidence adapters (L3) and each is required
# by a directive rather than chosen for convenience:
#
#   warcio    D-20 — bundles are WARC, the archiving standard, so that tooling
#                    which has never seen this code can open them.
#   psycopg   D-91 — sch_evidence: captures, evidence_bundles, hash_chain.
#   boto3     §10.1 — S3-compatible object store. Chosen over the minio client
#                    because production needs Object Lock for WORM storage.
#   rfc3161ng D-22 — external timestamping. A timestamp we generate ourselves
#                    proves nothing; this is what turns a capture into evidence.
dependencies = [
  "warcio>=1.7",
  "psycopg[binary]>=3.2",
  "boto3>=1.35",
  "rfc3161ng>=2.1",
  # The console and the pipeline trigger. FastAPI because §10.1 names it, and
  # because the JSON API is the real contract — the console is a view over it
  # and is replaceable without touching anything below.
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "import-linter>=2.0",
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

# ─────────────────────────────────────────────────────────────────────────────
# ruff
# ─────────────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "W",    # pycodestyle warnings
  "I",    # isort
  "UP",   # pyupgrade
  "B",    # bugbear
  "SIM",  # simplify
  "C4",   # comprehensions
  "RUF",  # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["asip"]

# ─────────────────────────────────────────────────────────────────────────────
# mypy
# ─────────────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true

# Third-party libraries that ship no type information. Listed by name rather
# than relaxed globally: each one is reachable only from an L3 adapter, and an
# untyped import appearing anywhere else should still be an error. Nothing here
# affects L1 — the domain layer imports none of them, by contract.
[[tool.mypy.overrides]]
module = ["warcio.*", "boto3.*", "botocore.*", "rfc3161ng.*"]
ignore_missing_imports = true

# L1 domain is the layer that must never be loosened. It has no I/O, so there
# is no third-party stub gap to excuse an Any. Strictest settings apply here
# and are expected to stay applied.
[[tool.mypy.overrides]]
module = ["asip.modules.*.domain.*"]
disallow_any_generics = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
warn_return_any = true
no_implicit_reexport = true

# ─────────────────────────────────────────────────────────────────────────────
# pytest — the four mandatory test layers of D-88
# ─────────────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -ra"
markers = [
  "fixtures: extractor golden-file suite (D-88.1) — never run filtered",
  "evidence: evidence integrity round-trip (D-88.2)",
  "rules: rule engine unit tests against synthetic ground truth (D-88.3)",
  "isolation: cross-tenant read attempts, must be rejected by RLS (D-88.4)",
  "contracts: consumer-driven contract tests (D-97)",
  "local_only: depends on an unsanitizable T3 fixture (R-04) — excluded from CI",
]
