# ASIP local development stack. MASTER_PLAN §10.2.
#
# Four backing services. The application containers (api, worker) and the
# observability stack (grafana, loki, prometheus) from §10.2 are deferred:
# there is no application to run yet, and starting containers that do nothing
# is a cost with no measured benefit (CLAUDE.md §3).
#
# The fetcher is deferred for a different and more important reason — see the
# network note at the bottom of this file.
#
# Credentials here are local throwaways for a container that is destroyed with
# `docker compose down -v`. Every real value lives in the secrets manager and
# is never read by an agent (docs/COMMANDS.md). Ports bind to 127.0.0.1 only.

name: asip

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-asip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-asip_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-asip}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-asip} -d ${POSTGRES_DB:-asip}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [core]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    # On both networks on purpose: the queue is the boundary, so it is the one
    # thing both zones must reach. Postgres is not on `fetch`, and never is.
    networks: [core, fetch]

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-asip}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-asip_dev_only}
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
    # Also on both: the fetch zone writes captured bytes here, which is the
    # only thing it is allowed to produce.
    networks: [core, fetch]

  # Temporal shares the Postgres instance rather than running its own. It
  # creates its own databases (temporal, temporal_visibility) there, which is
  # separate from ASIP's per-module schemas (D-91) and does not cross them.
  # One container instead of two, for a dev dependency.
  temporal:
    image: temporalio/auto-setup:1.25.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: ${POSTGRES_USER:-asip}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-asip_dev_only}
    ports:
      - "127.0.0.1:7233:7233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [core]

  # ═══════════════════════════════════════════════════════════════════════
  # THE FETCH ZONE (D-11, V-3)
  #
  # Note what this service is NOT on: the `core` network. It cannot reach
  # postgres because there is no route, not because it promises not to try.
  # It is given the queue and the object store and nothing else — no
  # ASIP_DB_URL, no POSTGRES_PASSWORD — and the worker refuses to start if it
  # finds one, because the likeliest way this breaks is a well-meaning edit to
  # a shared env file.
  #
  # If the fetch fleet is compromised, the attacker gets a browser pool and a
  # bucket they can write to. Not the evidence, and not the tenants.
  # ═══════════════════════════════════════════════════════════════════════
  fetcher:
    build:
      context: .
      dockerfile: Dockerfile.fetcher
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ASIP_FETCH_QUEUE_URL: redis://redis:6379/0
      ASIP_OBJECT_STORE_URL: http://minio:9000
      ASIP_OBJECT_STORE_KEY: ${MINIO_ROOT_USER:-asip}
      ASIP_OBJECT_STORE_SECRET: ${MINIO_ROOT_PASSWORD:-asip_dev_only}
      ASIP_FETCH_BUCKET: asip-captures
    # The fetch zone runs elsewhere, so "localhost" is its own loopback and not
    # the developer's. This gives it a name for the host so the canary served
    # by a locally-run API is reachable — the same problem any real source
    # behind a corporate egress presents, surfaced early rather than at deploy.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [fetch]
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════
  # THE UNATTENDED RUN
  #
  # Opt-in: `docker compose --profile scheduled up -d`. A scheduler that
  # started by default would fetch real sources the moment anyone brought the
  # stack up, which is the wrong default for a tool that spends money per
  # capture (D-13) and touches other people's servers (V-6).
  #
  # Safe to run more than one — a Postgres advisory lock means only one holds
  # a tick at a time. Export is NOT unattended: M-06 keeps it behind an
  # analyst's verdict, so this reaches detection and stops.
  # ═══════════════════════════════════════════════════════════════════════
  scheduler:
    profiles: [scheduled]
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: ["python", "-m", "asip.entrypoints.scheduler"]
    environment:
      ASIP_DB_URL: postgresql://${POSTGRES_USER:-asip}:${POSTGRES_PASSWORD:-asip_dev_only}@postgres:5432/${POSTGRES_DB:-asip}
      ASIP_OBJECT_STORE_URL: http://minio:9000
      ASIP_OBJECT_STORE_KEY: ${MINIO_ROOT_USER:-asip}
      ASIP_OBJECT_STORE_SECRET: ${MINIO_ROOT_PASSWORD:-asip_dev_only}
      ASIP_SCHEDULER_TICK: ${ASIP_SCHEDULER_TICK:-60}
      # Unset by default, so fetching happens in this process. Set it to
      # redis://redis:6379/0 and bring up the fetcher for the D-11 isolation.
      ASIP_FETCH_QUEUE_URL: ${ASIP_FETCH_QUEUE_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [core]
    # SIGTERM is handled: the loop finishes the tick in progress rather than
    # leaving a capture without its bundle. Give it room to do that.
    stop_grace_period: 90s
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:

networks:
  core:
    driver: bridge

  # V-3 / D-11. The fetch zone's network. Postgres is deliberately absent from
  # it, so the isolation is a routing fact rather than a convention. Adding
  # postgres here to make something work would be a veto violation, not a
  # configuration change.
  fetch:
    driver: bridge
